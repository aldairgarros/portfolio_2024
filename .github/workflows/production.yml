name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  build-and-deploy:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            --build-arg VITE_SENTRY_DSN="${{ secrets.VITE_SENTRY_DSN }}" \
            -t ghcr.io/aldairgarros/portfolio:${{ github.sha }} \
            -t ghcr.io/aldairgarros/portfolio:latest \
            .

      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/aldairgarros/portfolio:${{ github.sha }}
          docker push ghcr.io/aldairgarros/portfolio:latest

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "mkdir -p ~/portfolio"
          scp -o StrictHostKeyChecking=no compose.portfolio.yml $VPS_USER@$VPS_HOST:~/portfolio/compose.yml
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF
          set -e
          cd ~/portfolio
          PREV_SHA=\$(cat .previous_sha 2>/dev/null || true)
          echo "Logging into GitHub Container Registry..."
          echo "$GH_TOKEN" | podman login ghcr.io -u $GH_ACTOR --password-stdin || { echo "Error: Failed to log in to registry"; exit 1; }
          podman pull ghcr.io/aldairgarros/portfolio:$GITHUB_SHA
          IMAGE_TAG=$GITHUB_SHA podman-compose up -d || { echo "Error: podman-compose up failed"; if [ -n "\$PREV_SHA" ]; then IMAGE_TAG=\$PREV_SHA podman-compose up -d || echo "Error: rollback also failed"; sleep 5; curl -s --head http://127.0.0.1:3070 | grep "200 OK" > /dev/null && echo "Rollback healthy" || echo "Error: rollback health check failed"; else echo "Warning: No previous SHA to roll back to"; fi; exit 1; }
          sleep 5
          HEALTHY=""
          for i in 1 2 3 4 5; do
            if curl -s --head http://127.0.0.1:3070 | grep "200 OK" > /dev/null; then
              HEALTHY="yes"
              break
            fi
            echo "Health check attempt \$i failed, retrying..."
            sleep 2
          done
          if [ -n "\$HEALTHY" ]; then
            echo "Application is healthy"
            echo "$GITHUB_SHA" > .previous_sha
          else
            echo "Error: Application is not accessible"
            if [ -n "\$PREV_SHA" ]; then
              echo "Rolling back to \$PREV_SHA"
              IMAGE_TAG=\$PREV_SHA podman-compose up -d || echo "Error: rollback also failed"
              sleep 5
              curl -s --head http://127.0.0.1:3070 | grep "200 OK" > /dev/null && echo "Rollback healthy" || echo "Error: rollback health check failed"
            else
              echo "Warning: No previous SHA to roll back to"
            fi
            exit 1
          fi
          EOF
